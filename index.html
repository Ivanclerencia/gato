<style>
/* Idea: pantalla bloqueada en dos bloques con un corte recto: arriba la habitación con el gato,
   abajo un panel plano y sobrio con la lista. Poco radio, una sola tinta, tipografía mono + serif. */
:root{
  color-scheme: light;
  --paper:#efeeea; --row:#f8f7f4; --ink:#17150f; --muted:#7c786f; --line:#d9d6ce;
  --wall:#e6d8bf; --luz:#fff6dc; --cortina:#f5eedd; --pliegue:#e2d6bd; --madera:#8a5a36; --hoja:#5d7a4f;
  --sofa:#b4532e; --pana:#96421f; --vin:0; --noche:0;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-estado="cerrado"]{
  color-scheme: dark;
  --paper:#13151d; --row:#1b1e29; --ink:#eceef5; --muted:#8d92a5; --line:#2a2e3d;
  --vin:.5; --noche:.66;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.35;
  transition:background-color 1.2s ease,color 1.2s ease;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
main{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

.barra{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0}
.icono{width:44px;height:44px;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0;border-radius:8px}
.icono svg{display:block}
#fecha{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-right:6px}
main[data-vista="hoy"] .barra{color:#17150f}
:root[data-estado="cerrado"] main[data-vista="hoy"] .barra{color:#eceef5}

.escena{flex:none;height:46%;background:var(--wall);cursor:pointer;overflow:hidden;position:relative}
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;opacity:0;transition:opacity 1.2s ease;animation:fotoRespira 6s ease-in-out infinite;transform-origin:50% 100%}
:root[data-estado="abierto"] #fotoDia.ok,:root[data-estado="cerrado"] #fotoNoche.ok{opacity:1}
@keyframes fotoRespira{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.capa{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
:root[data-estado="abierto"] .confoto .motas,:root[data-estado="cerrado"] .confoto .brillo,:root[data-estado="cerrado"] .confoto .zs{opacity:1}
.motas i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff8e0;filter:blur(.5px);opacity:0;animation:mota linear infinite}
@keyframes mota{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}80%{opacity:.6}100%{transform:translate(28px,-64px);opacity:0}}
.brillo i{position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,rgba(255,186,104,.32),transparent 58%);mix-blend-mode:screen;animation:brillo 5.5s ease-in-out infinite}
@keyframes brillo{0%,100%{opacity:.45}50%{opacity:1}}
.zs span{position:absolute;font-family:var(--serif);color:#fff;opacity:0;animation:zz 4.4s ease-in-out infinite}
.zs span:nth-child(1){left:60%;top:36%;font-size:20px}.zs span:nth-child(2){left:65%;top:28%;font-size:26px;animation-delay:1.45s}.zs span:nth-child(3){left:71%;top:18%;font-size:34px;animation-delay:2.9s}
.escena>svg{display:block;width:100%;height:100%}
.escena>svg *{transition:fill 1.2s ease,stroke 1.2s ease,opacity 1.2s ease}
main[data-vista="compra"] .escena{display:none}
main.teclado .escena{display:none}
main.teclado .panel{padding-top:54px;border-top:0}
main[data-vista="compra"] .panel{padding-top:54px;border-top:0}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper);border-top:1px solid var(--line);
  padding:18px 16px 14px;transition:background-color 1.2s ease,border-color 1.2s ease}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;flex:none}
h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;letter-spacing:-.01em;margin:0;white-space:nowrap}
#cuenta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{flex:none;height:2px;background:var(--line);margin:14px 0 14px;transition:background-color 1.2s ease}
.seg i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s ease,background-color 1.2s ease}

.lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;list-style:none;margin:0;padding:0;scrollbar-width:none}
.lista::-webkit-scrollbar{display:none}
.fila{display:flex;align-items:center;gap:12px;background:var(--row);border-radius:8px;padding:11px 10px 11px 14px;margin-bottom:6px;transition:background-color 1.2s ease}
.fila .txt{flex:1;min-width:0}
.fila .tit{font-weight:500;overflow-wrap:anywhere}
.fila .sub{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--muted);margin-top:3px}
.fila.hecho .tit{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;font-weight:400}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.caja{flex:none;width:40px;height:40px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.caja i{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:13px;line-height:1;color:transparent;transition:background-color .2s ease}
.caja[aria-pressed="true"] i{background:var(--ink);color:var(--paper)}
.vacio{font-size:13px;color:var(--muted);margin:0 0 8px}
.aviso{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;-webkit-user-select:text;user-select:text}
.aviso button{display:block;margin-top:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.aviso input{width:100%;height:42px;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:var(--row);color:var(--ink);font:inherit;font-size:16px;padding:0 10px}

.add{flex:none;display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--row);color:var(--ink);font-family:var(--mono);font-size:16px;padding:0 12px;
  -webkit-user-select:text;user-select:text;transition:background-color 1.2s ease,border-color 1.2s ease}
.add input::placeholder{color:var(--muted)}
.add input:focus{outline:none;border-color:var(--ink)}
.add button{flex:none;width:48px;height:48px;border-radius:8px;border:0;background:var(--ink);color:var(--paper);font-size:24px;line-height:1;cursor:pointer;font-family:var(--mono)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#avisoGuardado{margin:8px 0 0}

.menu{position:absolute;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column;padding:10px 12px 20px}
.menu[hidden]{display:none}
.menu nav{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 12px}
.menu nav button{font-family:var(--serif);font-size:44px;line-height:1.1;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:var(--muted);cursor:pointer}
.menu nav button[aria-current="page"]{color:var(--ink)}
.menu .pie{padding:0 12px;font-size:12px}

/* gato */
#despierto,#dormido{transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.3,0,.2,1)}
#dormido{transform-origin:50% 100%}
.ojos{transform-box:fill-box;transform-origin:50% 50%;animation:parpadeo 6s infinite}
.cabeza{transform-box:fill-box;transform-origin:50% 100%;animation:ladea 7s ease-in-out infinite}
.purr{animation:purr .12s linear infinite}
.cola{transform-box:fill-box;transform-origin:80% 0%;animation:cola 3.8s ease-in-out infinite}
.prr{animation:prr 2.4s ease-in-out infinite}
.prr text{font-family:var(--mono);font-weight:500;fill:#fff3d6}
.respira{transform-box:fill-box;transform-origin:50% 100%;animation:respira 4.4s ease-in-out infinite}
.zz text{font-family:var(--serif);fill:#fff;opacity:0;animation:zz 4.4s ease-in-out infinite}
.zz text:nth-child(2){animation-delay:1.45s}.zz text:nth-child(3){animation-delay:2.9s}
@keyframes purr{0%,100%{transform:translateY(0)}50%{transform:translateY(.8px)}}
@keyframes cola{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
@keyframes prr{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes parpadeo{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes ladea{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes respira{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(14px,-34px)}}
@media (prefers-reduced-motion:reduce){
  .ojos,.cabeza,.respira,.zz text,.purr,.cola,.prr,.foto,.motas i,.brillo i,.zs span{animation:none}.zz text{opacity:.8}
  #despierto,#dormido,.escena>svg *,body,.panel,.fila,.seg,.seg i{transition:none}
}
</style>
</head>

      <ellipse cx="200" cy="392" rx="230" ry="190" fill="url(#lamp)" style="opacity:var(--noche);mix-blend-mode:screen" pointer-events="none"/>
      <rect width="400" height="500" fill="url(#vin)" style="opacity:var(--vin)" pointer-events="none"/>
      <g fill="#fff" style="opacity:var(--noche)"><circle cx="92" cy="40" r="1.6"/><circle cx="330" cy="30" r="1.3"/><circle cx="372" cy="150" r="1.4"/><circle cx="86" cy="170" r="1.2"/></g>
    </svg>
    <img class="foto" id="fotoDia" alt="" hidden>
    <img class="foto" id="fotoNoche" alt="" hidden>
    <div class="capa motas" id="motas"></div>
    <div class="capa brillo"><i></i></div>
    <div class="capa zs"><span>z</span><span>z</span><span>z</span></div>
  </div>

  <section class="panel">
    <div class="cab"><h1 id="titular">…</h1><span id="cuenta"></span></div>
    <div class="seg" aria-hidden="true"><i id="barraProg"></i></div>
    <ul class="lista" id="lista"></ul>
    <p class="vacio" id="vacio" hidden></p>
    <div id="avisoCal" hidden></div>
    <form class="add" id="form" autocomplete="off">
      <input type="text" id="nueva" maxlength="120" placeholder="Añadir algo para hoy" aria-label="Añadir" enterkeyhint="done">
      <button type="submit" aria-label="Añadir">+</button>
    </form>
    <p class="vacio" id="avisoGuardado" hidden></p>
  </section>

  <div class="menu" id="menu" hidden>
    <div><button class="icono" id="cerrarMenu" type="button" aria-label="Cerrar menú">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l12 12M17 5L5 17"/></svg>
    </button></div>
    <nav>
      <button type="button" data-ir="hoy">Hoy</button>
      <button type="button" data-ir="compra">Lista de la compra</button>
    </nav>
    <p class="pie" id="pie" hidden><button class="lnk" type="button" id="desconectar">Desconectar el calendario de este móvil</button></p>
  </div>
</main>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return String(n).padStart(2,"0")};
  var dayKey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var addDays=function(k,n){var p=k.split("-").map(Number);return dayKey(new Date(p[0],p[1]-1,p[2]+n))};
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var LS="gato-sofa-estado";
  function norm(d){d=d||{};return {manual:Array.isArray(d.manual)?clone(d.manual):[],cal:(d.cal&&typeof d.cal==="object")?clone(d.cal):{},compra:Array.isArray(d.compra)?clone(d.compra):[]}}
  function nuevoId(){return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

  var today=dayKey(new Date());
  var S=norm(null);                  // lo que se guarda: tareas tuyas, tics del calendario y lista de la compra
  var E=null;                        // eventos del calendario (null = aún no)
  var calError=null, vista="hoy";
  var mcp=null, ref=null, unsubCal=null, writing=false, dirty=false;

  try{var raw=localStorage.getItem(LS); if(raw) S=norm(JSON.parse(raw));}catch(e){}

  function evDay(ev){
    var s=ev.start||{}, e=ev.end||{};
    if(s.date) return {start:s.date,end:e.date||addDays(s.date,1),time:""};
    if(s.dateTime){var d=new Date(s.dateTime); if(isNaN(d)) return null;
      return {start:dayKey(d),end:addDays(dayKey(d),1),time:pad(d.getHours())+":"+pad(d.getMinutes())};}
    return null;
  }
  function itemsHoy(){
    var out=[];
    (E||[]).forEach(function(ev){
      var d=evDay(ev); if(!d) return;
      if(d.start<=today && today<d.end){
        var k=String(ev.id)+"@"+today;
        out.push({tipo:"cal",key:k,titulo:String(ev.summary||"(sin título)"),hora:d.time,estado:S.cal[k]||""});
      }
    });
    S.manual.forEach(function(m){
      var desde=m.desde||m.added||today;
      if(desde>today) return;
      if(m.done && m.done!==today) return;
      out.push({tipo:"mio",key:m.id,titulo:String(m.t||""),hora:"",estado:m.done===today?"ok":""});
    });
    return out;
  }

  function el(tag,cls,txt){var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n}
  function lnk(txt,fn){var b=el("button","lnk",txt); b.type="button"; b.addEventListener("click",fn); return b}
  function fila(titulo,hecho,subs,alMarcar){
    var li=el("li","fila"+(hecho?" hecho":""));
    var tx=el("div","txt"); tx.appendChild(el("div","tit",titulo));
    if(subs&&subs.length){var s=el("div","sub"); subs.forEach(function(x){s.appendChild(typeof x==="string"?el("span",null,x):x)}); tx.appendChild(s);}
    var b=el("button","caja"); b.type="button"; b.appendChild(el("i",null,"✓"));
    b.setAttribute("aria-pressed",hecho?"true":"false"); b.setAttribute("aria-label",(hecho?"Desmarcar: ":"Marcar: ")+titulo);
    b.addEventListener("click",alMarcar);
    li.appendChild(tx); li.appendChild(b); return li;
  }

  function render(){
    var items=itemsHoy();
    var total=items.length, hechos=items.filter(function(i){return i.estado}).length;
    var cargando=(E===null && !calError);
    var cerrado=!cargando && hechos===total;
    // el estado de día o noche lo marca siempre lo de hoy, también en la lista de la compra
    document.documentElement.setAttribute("data-estado",cerrado?"cerrado":"abierto");
    var prog= total? hechos/total : 0;
    $("ojosP").style.transform="scaleY("+(1-.5*prog).toFixed(2)+")";
    $("despierto").style.opacity=cerrado?"0":"1";
    var z=$("dormido"); z.style.opacity=cerrado?"1":"0"; z.style.transform=cerrado?"scale(1)":"scale(.86)";
    $("app").setAttribute("data-vista",vista);
    var ul=$("lista"); ul.textContent="";
    var vacio=$("vacio"); vacio.hidden=true;

    if(vista==="compra"){
      var c=S.compra, faltan=c.filter(function(x){return !x.done}).length;
      $("titular").textContent="Lista de la compra";
      var cu=$("cuenta"); cu.textContent="";
      if(c.length){ cu.appendChild(document.createTextNode(faltan===0?"todo comprado":faltan+(faltan===1?" por comprar":" por comprar")));
        if(c.length>faltan){cu.appendChild(document.createTextNode(" · ")); cu.appendChild(lnk("borrar comprados",function(){S.compra=S.compra.filter(function(x){return !x.done});save();render()}));} }
      $("barraProg").style.width=c.length?Math.round(100*(c.length-faltan)/c.length)+"%":"0";
      c.filter(function(x){return !x.done}).concat(c.filter(function(x){return x.done})).forEach(function(x){
        ul.appendChild(fila(String(x.t||""),!!x.done,x.done?null:[lnk("quitar",function(){S.compra=S.compra.filter(function(y){return y.id!==x.id});save();render()})],
          function(){x.done=!x.done;save();render()}));
      });
      if(!c.length){vacio.hidden=false;vacio.textContent="La lista está vacía. Apunta abajo lo que falte.";}
      $("nueva").placeholder="Añadir a la compra";
      $("avisoCal").hidden=true;
      return;
    }

    var h=$("titular"), q=total-hechos;
    if(cargando) h.textContent="…";
    else if(cerrado && total===0) h.textContent="Hoy no hay nada.";
    else if(cerrado) h.textContent="Hoy está hecho.";
    else h.textContent=(q===1?"Queda ":"Quedan ")+q;
    $("cuenta").textContent=total?hechos+" / "+total:"";
    $("barraProg").style.width=Math.round(prog*100)+"%";
    $("nueva").placeholder="Añadir algo para hoy";

    items.filter(function(i){return !i.estado}).concat(items.filter(function(i){return i.estado})).forEach(function(it){
      var subs=[it.tipo==="cal"?(it.hora?"calendario · "+it.hora:"calendario"):"tuyo"];
      if(it.estado==="no") subs.push("hoy no me toca");
      if(!it.estado){
        if(it.tipo==="cal") subs.push(lnk("hoy no me toca",function(){S.cal[it.key]="no";save();render()}));
        else{subs.push(lnk("mañana",function(){var x=buscar(it.key);if(x){x.desde=addDays(today,1);save();render()}}));
             subs.push(lnk("quitar",function(){S.manual=S.manual.filter(function(x){return x.id!==it.key});save();render()}));}
      }
      ul.appendChild(fila(it.titulo,!!it.estado,subs,function(){toggle(it)}));
    });
    renderAvisoCal();
  }

  function buscar(id){for(var i=0;i<S.manual.length;i++) if(S.manual[i].id===id) return S.manual[i]; return null}
  function toggle(it){
    if(it.tipo==="cal"){ if(S.cal[it.key]) delete S.cal[it.key]; else S.cal[it.key]="ok"; }
    else{var m=buscar(it.key); if(m) m.done = m.done===today? null : today;}
    save(); render();
  }
  function podar(){
    var lim=addDays(today,-7);
    Object.keys(S.cal).forEach(function(k){var d=k.slice(k.lastIndexOf("@")+1); if(d<lim) delete S.cal[k]});
    S.manual=S.manual.filter(function(m){return !(m.done && m.done<lim)});
  }
  function avisoG(t){var a=$("avisoGuardado"); a.hidden=!t; a.textContent=t||""}
  function guardarLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
  function save(){
    podar(); guardarLocal();
    if(API){apiSave();return}
    if(!ref) return;
    if(writing){dirty=true;return}
    writing=true;
    (function loop(){
      dirty=false;
      ref.set(clone(S)).then(function(){ if(dirty) loop(); else{writing=false; avisoG("");} },
        function(err){writing=false;
          avisoG((err&&err.code==="quota_exceeded")?"No queda espacio para guardar. Quita cosas antiguas.":"No se ha podido guardar este cambio en la nube. Sigue apuntado en este dispositivo.");});
    })();
  }

  $("form").addEventListener("submit",function(ev){
    ev.preventDefault(); var i=$("nueva"), t=i.value.trim(); if(!t) return;
    if(vista==="compra") S.compra.push({id:nuevoId(),t:t,done:false});
    else S.manual.push({id:nuevoId(),t:t,added:today,done:null});
    i.value=""; save(); render();
  });

  // --- menú
  function irA(v){vista=v; $("menu").hidden=true; render()}
  $("abrirMenu").addEventListener("click",function(){
    Array.prototype.forEach.call(document.querySelectorAll("#menu nav button"),function(b){ if(b.getAttribute("data-ir")===vista) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
    $("menu").hidden=false;
  });
  $("cerrarMenu").addEventListener("click",function(){$("menu").hidden=true});
  Array.prototype.forEach.call(document.querySelectorAll("#menu nav button"),function(b){b.addEventListener("click",function(){irA(b.getAttribute("data-ir"))})});

  // --- pantalla bloqueada: solo se desliza la lista, y solo si no cabe
  document.addEventListener("touchmove",function(ev){
    var l=ev.target.closest?ev.target.closest(".lista"):null;
    if(!l || l.scrollHeight<=l.clientHeight) ev.preventDefault();
  },{passive:false});

  // --- teclado del móvil: la app se encoge al hueco visible en vez de irse hacia arriba
  (function(){
    var vv=window.visualViewport; if(!vv) return;
    var app=$("app"), pend=false;
    function ajustar(){
      pend=false;
      var conTeclado=vv.height<window.innerHeight-120;
      app.style.height=conTeclado?Math.round(vv.height)+"px":"";
      app.classList.toggle("teclado",conTeclado);
      if(window.scrollY||document.documentElement.scrollTop||vv.offsetTop) window.scrollTo(0,0);
    }
    function pedir(){ if(!pend){pend=true; requestAnimationFrame(ajustar);} }
    vv.addEventListener("resize",pedir); vv.addEventListener("scroll",pedir);
    window.addEventListener("scroll",pedir,{passive:true});
    document.addEventListener("focusin",function(){setTimeout(ajustar,60);setTimeout(ajustar,350)});
    document.addEventListener("focusout",function(){setTimeout(ajustar,60);setTimeout(ajustar,350)});
  })();

  // --- calendario dentro de Claude
  var CAL="Google Calendar", TOOL="list_events";
  function calInput(){return {startTime:today+"T00:00:00",endTime:addDays(today,2)+"T00:00:00",orderBy:"startTime",pageSize:80}}
  function leerPayload(res){
    var p=res&&res.payload; if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
    var evs=p&&Array.isArray(p.events)?p.events:[];
    return evs.filter(function(e){return e&&e.status!=="cancelled"});
  }
  function watchCal(){
    if(!mcp) return; if(unsubCal){unsubCal();unsubCal=null}
    unsubCal=mcp.watchTool(CAL,TOOL,calInput(),function(ev){
      if(ev.type==="data"){E=leerPayload(ev.result);calError=null;}
      else{var code=ev.error&&ev.error.code||"upstream_error"; calError=code;
        if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","consent_required"].indexOf(code)>=0){E=[];}
        else if(E===null) E=[];}
      render();
    },{cache:{staleTime:300000,gcTime:86400000},refetchInterval:600000});
  }
  function renderAvisoCal(){
    var box=$("avisoCal"); box.textContent="";
    var msg="", btn=false;
    if(SOLO && !API){renderConecta(box);return}
    if(SOLO){ if(calError) msg="No llego a tu calendario ahora mismo. Se vuelve a intentar al abrir la app."; }
    else if(mcp===false) msg="Aquí no puedo leer tu calendario. Lo que añadas a mano funciona igual.";
    else if(calError==="needs_reauth") msg="Google Calendar ha caducado. Vuelve a conectarlo en Claude, en Ajustes → Conectores.";
    else if(calError==="server_not_connected"||calError==="selection_required") msg="No encuentro Google Calendar. Añádelo en Claude, en Ajustes → Conectores.";
    else if(calError==="approval_required"||calError==="consent_required"){msg="Falta tu permiso para leer el calendario.";btn=true;}
    else if(calError==="not_in_manifest"||calError==="blocked_by_policy") msg="Esta página no tiene permiso para leer el calendario. Lo que añadas a mano funciona igual.";
    else if(calError) msg="El calendario no responde ahora mismo. Se vuelve a intentar solo.";
    box.hidden=!msg; if(!msg) return;
    var p=el("div","aviso"); p.appendChild(el("div",null,msg));
    if(btn){var b=el("button",null,"Permitir leer el calendario"); b.type="button";
      b.addEventListener("click",function(){b.disabled=true;
        mcp.callTool(CAL,TOOL,calInput()).then(function(r){E=leerPayload(r);calError=null;render()},function(){b.disabled=false})});
      p.appendChild(b);}
    box.appendChild(p);
  }

  function tick(){
    $("fecha").textContent=new Intl.DateTimeFormat("es-ES",{weekday:"short",day:"numeric",month:"short"}).format(new Date()).replace(/\./g,"");
    var k=dayKey(new Date()); if(k!==today){today=k; watchCal(); apiLoad(); render();}
  }
  setInterval(tick,60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();apiLoad()}});
  setInterval(function(){if(!document.hidden) apiLoad()},300000);

  // --- versión instalada en el móvil: calendario y datos a través de tu script de Google
  var SOLO=!(window.claude&&window.claude.use);
  var API=null, apiPend=false, apiTimer=null, apiBusy=false;
  var BASE="https://script.google.com/macros/s/";
  var RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
  try{API=localStorage.getItem("gato-api")||null; apiPend=localStorage.getItem("gato-pend")==="1";}catch(e){}
  try{var kq=new URLSearchParams(location.search).get("k"); if(kq&&/^[\w-]{20,}$/.test(kq)){API=BASE+kq+"/exec"; try{localStorage.setItem("gato-api",API)}catch(e){}}}catch(e){}
  if(!SOLO) API=null;
  function ponerK(u){try{var id=u?u.slice(BASE.length,-5):""; history.replaceState(null,"",location.pathname+(id?"?k="+id:""))}catch(e){}}
  function setPend(v){apiPend=v; try{localStorage.setItem("gato-pend",v?"1":"0")}catch(e){}}
  function leerApi(url){return fetch(url+"?from="+today+"&days=2").then(function(r){return r.json()}).then(function(j){if(!j||!j.ok) throw new Error("x"); return j})}
  function aplicarApi(j){
    E=Array.isArray(j.events)?j.events:[]; calError=null;
    try{localStorage.setItem("gato-ev",JSON.stringify({d:today,e:E}))}catch(e){}
    if(!apiPend && j.state && Array.isArray(j.state.manual)){S=norm(j.state); guardarLocal();}
    render();
  }
  function apiLoad(){ if(!API) return; leerApi(API).then(aplicarApi,function(){calError="red"; if(E===null)E=[]; render()}) }
  function apiSave(){
    setPend(true); clearTimeout(apiTimer);
    apiTimer=setTimeout(function enviar(){
      if(apiBusy){apiTimer=setTimeout(enviar,400);return}
      apiBusy=true; var foto=JSON.stringify({state:S});
      fetch(API,{method:"POST",body:foto}).then(function(r){return r.json()}).then(function(){
        apiBusy=false; if(JSON.stringify({state:S})===foto){setPend(false);avisoG("")}
      },function(){apiBusy=false; avisoG("Sin conexión: el cambio se queda en este móvil y se envía la próxima vez.")});
    },500);
  }
  function renderConecta(box){
    box.hidden=false;
    var p=el("div","aviso"); p.appendChild(el("div",null,"Conecta tu calendario: pega aquí el enlace de tu script de Google."));
    var i=el("input"); i.type="url"; i.id="enlace"; i.placeholder="https://script.google.com/macros/s/…/exec"; i.setAttribute("aria-label","Enlace del script");
    var m=el("div"); m.style.marginTop="6px";
    var b=el("button",null,"Conectar"); b.type="button";
    b.addEventListener("click",function(){
      var u=i.value.trim();
      if(!RE.test(u)){m.textContent="Ese enlace no parece el del script. Tiene que empezar por https://script.google.com/macros/s/ y acabar en /exec.";return}
      b.disabled=true; m.textContent="Probando…";
      leerApi(u).then(function(j){API=u; try{localStorage.setItem("gato-api",u)}catch(e){} $("pie").hidden=false; ponerK(u);
          var local=S.manual.length||S.compra.length||Object.keys(S.cal).length; var remoto=j.state&&((j.state.manual||[]).length||(j.state.compra||[]).length);
          if(local&&!remoto){apiPend=true;} aplicarApi(j); if(local&&!remoto) apiSave();},
        function(){b.disabled=false; m.textContent="El enlace no responde. Revisa que en la implementación el acceso sea «Cualquier usuario».";});
    });
    p.appendChild(i); p.appendChild(b); p.appendChild(m); box.appendChild(p);
  }
  $("desconectar").addEventListener("click",function(){API=null; try{localStorage.removeItem("gato-api");localStorage.removeItem("gato-ev")}catch(e){} ponerK(null); E=[]; calError=null; $("pie").hidden=true; $("menu").hidden=true; render();});

  // --- ilustraciones de los gatos (si no cargan, se queda el dibujo)
  (function(){
    var F=window.GATO_FOTOS; if(!F) return;
    var mo=$("motas"); for(var n=0;n<14;n++){var i=document.createElement("i"); i.style.left=(8+Math.random()*84)+"%"; i.style.top=(20+Math.random()*70)+"%";
      i.style.animationDuration=(7+Math.random()*8).toFixed(1)+"s"; i.style.animationDelay=(-Math.random()*12).toFixed(1)+"s"; mo.appendChild(i);}
    [["fotoDia",F.dia],["fotoNoche",F.noche]].forEach(function(x){
      if(!x[1]) return; var im=$(x[0]);
      im.addEventListener("load",function(){im.classList.add("ok"); $("escena").classList.add("confoto")});
      im.addEventListener("error",function(){im.hidden=true});
      im.hidden=false; im.src=x[1];
    });
  })();

  // --- ronroneo al tocar al gato
  var actx=null;
  $("escena").addEventListener("click",function(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
      var t=actx.currentTime, d=2.8, n=Math.floor(actx.sampleRate*d), buf=actx.createBuffer(1,n,actx.sampleRate), ch=buf.getChannelData(0), last=0;
      for(var k=0;k<n;k++){var w=Math.random()*2-1; last=(last+0.02*w)/1.02; ch[k]=last*3.5;}
      var src=actx.createBufferSource(); src.buffer=buf;
      var lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=240;
      var trem=actx.createGain(); trem.gain.value=.55;
      var lfo=actx.createOscillator(); lfo.type="sawtooth"; lfo.frequency.value=24; var lg=actx.createGain(); lg.gain.value=.45;
      var env=actx.createGain(); env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(.9,t+.4); env.gain.linearRampToValueAtTime(0,t+d);
      lfo.connect(lg); lg.connect(trem.gain); src.connect(lp); lp.connect(trem); trem.connect(env); env.connect(actx.destination);
      src.start(t); lfo.start(t); lfo.stop(t+d);
    }catch(e){}
  });

  tick();
  if(SOLO){
    mcp=false;
    if(API){
      $("pie").hidden=false; ponerK(API);
      try{var c=JSON.parse(localStorage.getItem("gato-ev")||"null"); if(c&&c.d===today&&Array.isArray(c.e)) E=c.e;}catch(e){}
      render(); if(apiPend) apiSave(); apiLoad();
    } else { E=[]; render(); }
    return;
  }
  render();
  var use=window.claude.use.bind(window.claude);

  use("mcp").then(function(m){ if(m){mcp=m;watchCal();} else{mcp=false;E=[];render();} },function(){mcp=false;E=[];render()});

  use("db").then(function(db){
    if(!db){ avisoG("Los tics se guardan solo en este dispositivo."); return; }
    ref=db.doc("sofa/estado");
    var t=setTimeout(function(){ avisoG("Aún no llego a los datos guardados. Lo que ves puede no estar al día."); },10000);
    ref.onSnapshot(function(snap){
      if(!snap.metadata.fromCache){clearTimeout(t); if(!writing) avisoG("");}
      if(snap.metadata.hasPendingWrites||writing) return;
      if(snap.exists){ S=norm(snap.data()); guardarLocal(); render(); }
    },function(){clearTimeout(t); ref=null; avisoG("No puedo guardar en la nube ahora. Los tics se quedan en este dispositivo.");});
  },function(){});
})();
</script>
</body>
</html>
