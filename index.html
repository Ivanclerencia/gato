<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El gato en el sofá</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gato">
<meta name="theme-color" content="#e6d8bf">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Idea: la habitación ocupa la pantalla de borde a borde, con el titular gigante detrás del gato.
   Encima se apoya una hoja de cristal con las cosas de hoy como tarjetas de color apiladas.
   Al cerrar el día, el fondo pasa de tarde clara a atardecer oscuro. */
:root{
  color-scheme: light;
  --bg1:#e6d8bf; --ink:#26170d; --muted:#6d5a48;
  --glass:rgba(255,255,255,.46); --glass-b:rgba(255,255,255,.75); --glass-2:rgba(255,255,255,.3);
  --accent:#ffd05e; --on-accent:#26170d; --dark:#26170d; --on-dark:#fff3df;
  --wall:#e6d8bf; --luz:#fff6dc; --cortina:#f5eedd; --pliegue:#e2d6bd; --madera:#8a5a36; --hoja:#5d7a4f;
  --sofa:#b4532e; --pana:#96421f; --vin:0; --noche:0; --titulo:#ffffff; --titulo-o:.85;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
}
:root[data-estado="cerrado"]{
  color-scheme: dark;
  --bg1:#4a4c5c; --ink:#eef1fb; --muted:#aeb7d1;
  --glass:rgba(200,215,255,.11); --glass-b:rgba(200,215,255,.24); --glass-2:rgba(200,215,255,.06);
  --dark:#eef1fb; --on-dark:#141a2e;
  --vin:.5; --noche:.66; --titulo:#f1f4ff; --titulo-o:.92;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(180deg,#e6d8bf 0,#e6d8bf 320px,#f0dcc0 640px,#e7bf98 100%) fixed;color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.4;transition:color 1.4s ease;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity 1.4s ease;
  background:linear-gradient(180deg,#646a8a 0,#4a5174 300px,#1d2340 620px,#0b0f20 100%)}
:root[data-estado="cerrado"] body::before{opacity:1}
main{max-width:440px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-top:-64px;padding:22px 0 110px;position:relative;z-index:2;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px);mask-image:linear-gradient(to bottom,transparent 0,#000 22px)}
.scroll::-webkit-scrollbar{display:none}

.escena{position:relative;cursor:pointer;flex:none}
.escena svg{display:block;width:100%;height:min(125vw,550px,58vh)}
.escena svg *{transition:fill 1.4s ease,stroke 1.4s ease,opacity 1.2s ease}
.chip{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.75;transition:color 1.4s ease}

.hoja{position:relative;margin:0 10px;padding:18px 12px 14px;border-radius:34px;background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);transition:background-color 1.4s ease,border-color 1.4s ease}
#sub{margin:0 8px;font-weight:600;font-size:17px;text-wrap:balance}
.seg{display:flex;gap:5px;margin:12px 8px 16px;height:7px}
.seg span{flex:1;border-radius:99px;background:var(--glass-2);border:1px solid var(--glass-b);transition:background-color .5s ease}
.seg span.on{background:var(--dark);border-color:var(--dark)}

ul{list-style:none;margin:0;padding:0}
.t{position:relative;display:flex;gap:12px;align-items:center;border-radius:28px;padding:16px 14px 16px 18px;color:#26170d;margin-top:-14px;
  box-shadow:0 -6px 16px -10px rgba(60,25,5,.35)}
.t:first-child{margin-top:0;box-shadow:none}
.t:not(:last-child){padding-bottom:30px}
.t .txt{flex:1;min-width:0}
.t .tit{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.12;letter-spacing:-.01em;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pill{font:inherit;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1.5px solid rgba(38,23,13,.75);background:transparent;color:#26170d}
button.pill{cursor:pointer;border-style:dashed}
button.pill:hover{background:rgba(38,23,13,.1)}
.tic{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid #26170d;background:transparent;color:transparent;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:all .25s ease}
.tic:hover{background:rgba(38,23,13,.12)}
.t.hecho{background:var(--glass-2)!important;border:1px solid var(--glass-b);color:var(--muted);box-shadow:none;margin-top:8px;padding:10px 12px 10px 18px}
.t.hecho .tit{font-size:16px;font-weight:600;text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.t.hecho .nota{font-size:12px;margin-top:2px}
.t.hecho .tic{width:40px;height:40px;font-size:17px;background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.vacio{font-size:15px;color:var(--muted);margin:0;padding:4px 8px 8px}
.aviso{font-size:14px;color:var(--muted);margin:10px 0 0;border:1px dashed var(--glass-b);border-radius:18px;padding:10px 14px}
.aviso button{display:block;margin-top:8px;height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}

.conecta input{width:100%;height:44px;margin-top:8px;border-radius:14px;border:1px solid var(--glass-b);background:var(--glass-2);color:var(--ink);font:inherit;padding:0 12px}
.pie{margin:26px 22px 0;font-size:13px}
.pie button{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dias{margin:22px 0 0}
.dias h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 22px 10px}
.tira{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.dia{flex:none;width:76px;height:76px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);color:var(--ink);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;scroll-snap-align:start;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background-color .3s ease,border-color 1.4s ease}
.dia small{font-size:11px;font-weight:600;text-transform:capitalize;color:var(--muted)}
.dia b{font-family:var(--display);font-size:24px;font-weight:800}
.dia[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.dia[aria-pressed="true"] small{color:var(--on-dark)}
.detalle{margin:6px 18px 0;padding:12px 16px;border-radius:22px;background:var(--glass-2);border:1px solid var(--glass-b);font-size:14px}
.detalle li{padding:5px 0}
.detalle li+li{border-top:1px solid var(--glass-b)}

.barra{position:fixed;left:0;right:0;bottom:14px;z-index:5;display:flex;justify-content:center;pointer-events:none}
.barra form{pointer-events:auto;width:min(416px,calc(100% - 24px));display:flex;gap:8px;align-items:center;padding:7px 7px 7px 20px;border-radius:99px;
  background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 14px 34px -14px rgba(40,15,0,.55);transition:background-color 1.4s ease,border-color 1.4s ease}
.barra input{flex:1;min-width:0;height:46px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500}
.barra input:focus{outline:none}
.barra form:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.barra input::placeholder{color:var(--muted)}
.add{flex:none;width:52px;height:46px;border-radius:99px;border:0;background:var(--accent);color:var(--on-accent);font-size:26px;line-height:1;cursor:pointer;font-weight:500}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#avisoGuardado{margin:10px 22px 0}

/* gato */
#grande{font-family:var(--display);font-weight:800;letter-spacing:-.03em;fill:var(--titulo);opacity:var(--titulo-o)}
#despierto,#dormido{transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.3,0,.2,1)}
#dormido{transform-origin:50% 100%}
.ojos{transform-box:fill-box;transform-origin:50% 50%;animation:parpadeo 6s infinite}
.cabeza{transform-box:fill-box;transform-origin:50% 100%;animation:ladea 7s ease-in-out infinite}
.purr{animation:purr .12s linear infinite}
.cola{transform-box:fill-box;transform-origin:80% 0%;animation:cola 3.8s ease-in-out infinite}
.prr{animation:prr 2.4s ease-in-out infinite}
.prr text{font-family:var(--display);font-weight:800;fill:#fff3d6}
@keyframes purr{0%,100%{transform:translateY(0)}50%{transform:translateY(.8px)}}
@keyframes cola{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
@keyframes prr{0%,100%{opacity:.25}50%{opacity:.95}}
.respira{transform-box:fill-box;transform-origin:50% 100%;animation:respira 4.4s ease-in-out infinite}
.zz text{font-family:var(--display);font-weight:800;fill:#fff;opacity:0;animation:zz 4.4s ease-in-out infinite}
.zz text:nth-child(2){animation-delay:1.45s}.zz text:nth-child(3){animation-delay:2.9s}
@keyframes parpadeo{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes ladea{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes respira{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(14px,-34px)}}
@media (prefers-reduced-motion:reduce){
  .ojos,.cabeza,.respira,.zz text,.purr,.cola,.prr{animation:none}.zz text{opacity:.8}
  #despierto,#dormido,.escena svg *,body,body::before,.hoja,.chip,.barra form{transition:none}
}
</style>
</head>

    <div class="seg" id="seg" aria-hidden="true"></div>
    <ul id="lista"></ul>
    <p class="vacio" id="vacio" hidden>No hay nada apuntado para hoy.</p>
    <div id="avisoCal" hidden></div>
  </section>
  <p class="vacio" id="avisoGuardado" hidden></p>

  <section class="dias" id="secSig" hidden>
    <h2>Lo demás ya tiene su día</h2>
    <div class="tira" id="tira"></div>
    <ul class="detalle" id="detalle" hidden></ul>
  </section>
  <p class="pie" id="pie" hidden><button type="button" id="desconectar">Desconectar el calendario de este móvil</button></p>
  </div>
</main>

<div class="barra">
  <form id="form" autocomplete="off">
    <input type="text" id="nueva" maxlength="120" placeholder="Añadir algo para hoy" aria-label="Añadir algo para hoy">
    <button class="add" type="submit" aria-label="Añadir">+</button>
  </form>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return String(n).padStart(2,"0")};
  var dayKey=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var addDays=function(k,n){var p=k.split("-").map(Number);return dayKey(new Date(p[0],p[1]-1,p[2]+n))};
  var keyDate=function(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var LS="gato-sofa-estado";
  var COLORES=["#ffd67e","#f6b88a","#efe3cd","#cdd7ab","#f3a78d"];

  var today=dayKey(new Date());
  var S={manual:[],cal:{}};          // lo que se guarda
  var E=null;                        // eventos del calendario (null = aún no)
  var calError=null, diaSel=null;
  var mcp=null, ref=null, unsubCal=null, writing=false, dirty=false;

  try{var raw=localStorage.getItem(LS); if(raw){var o=JSON.parse(raw); if(o&&Array.isArray(o.manual)) S={manual:o.manual,cal:o.cal||{}};}}catch(e){}

  function evDay(ev){
    var s=ev.start||{}, e=ev.end||{};
    if(s.date) return {start:s.date,end:e.date||addDays(s.date,1),time:""};
    if(s.dateTime){var d=new Date(s.dateTime); if(isNaN(d)) return null;
      return {start:dayKey(d),end:addDays(dayKey(d),1),time:pad(d.getHours())+":"+pad(d.getMinutes())};}
    return null;
  }
  function itemsHoy(){
    var out=[];
    (E||[]).forEach(function(ev){
      var d=evDay(ev); if(!d) return;
      if(d.start<=today && today<d.end){
        var k=String(ev.id)+"@"+today;
        out.push({tipo:"cal",key:k,titulo:String(ev.summary||"(sin título)"),hora:d.time,estado:S.cal[k]||""});
      }
    });
    S.manual.forEach(function(m){
      var desde=m.desde||m.added||today;
      if(desde>today) return;
      if(m.done && m.done!==today) return;
      out.push({tipo:"mio",key:m.id,titulo:String(m.t||""),hora:"",estado:m.done===today?"ok":""});
    });
    return out;
  }

  function el(tag,cls,txt){var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n}
  function pillBtn(txt,fn){var b=el("button","pill",txt); b.type="button"; b.addEventListener("click",fn); return b}

  function render(){
    var items=itemsHoy();
    var total=items.length, hechos=items.filter(function(i){return i.estado}).length;
    var cargando=(E===null && !calError);
    var cerrado=!cargando && hechos===total;
    document.documentElement.setAttribute("data-estado",cerrado?"cerrado":"abierto");

    // gato: despierto mira desde arriba y se le van cerrando los ojos; dormido, en primer plano
    var prog= total? hechos/total : 0;
    $("ojosP").style.transform="scaleY("+(1-.5*prog).toFixed(2)+")";
    $("despierto").style.opacity=cerrado?"0":"1";
    var z=$("dormido"); z.style.opacity=cerrado?"1":"0"; z.style.transform=cerrado?"scale(1)":"scale(.86)";

    var g=$("grande"), sub=$("sub"), q=total-hechos;
    if(cargando){g.textContent="···";sub.textContent="Mirando el día. Un momento.";}
    else if(cerrado && total===0){g.textContent="Libre";sub.textContent="Hoy no hay nada. El sofá es tuyo.";}
    else if(cerrado){g.textContent="Cerrado";sub.textContent="Hoy está hecho. Puedes tumbarte.";}
    else{g.textContent=(q===1?"Queda ":"Quedan ")+q;
      sub.textContent=hechos? "Llevas "+hechos+" de "+total+". Al gato ya se le cierran los ojos." : (total===1?"Una cosa para hoy. Nada más.":total+" cosas para hoy. Nada más.");}
    g.setAttribute("font-size",g.textContent.length>=7?"76":"96");

    var seg=$("seg"); seg.textContent="";
    for(var i=0;i<total;i++){seg.appendChild(el("span",i<hechos?"on":""))}
    seg.hidden=total===0;

    var ul=$("lista"); ul.textContent="";
    var pend=items.filter(function(i){return !i.estado}), ok=items.filter(function(i){return i.estado});
    pend.forEach(function(it,n){
      var li=el("li","t"); li.style.background=COLORES[n%COLORES.length]; li.style.zIndex=String(n+1);
      var tx=el("div","txt"); tx.appendChild(el("div","tit",it.titulo));
      var p=el("div","pills");
      p.appendChild(el("span","pill",it.tipo==="cal"?(it.hora?"Calendario · "+it.hora:"Calendario"):"Tuyo"));
      if(it.tipo==="cal") p.appendChild(pillBtn("Hoy no me toca",function(){S.cal[it.key]="no";save();render()}));
      else{p.appendChild(pillBtn("Mañana",function(){var x=buscar(it.key);if(x){x.desde=addDays(today,1);save();render()}}));
           p.appendChild(pillBtn("Quitar",function(){S.manual=S.manual.filter(function(x){return x.id!==it.key});save();render()}));}
      tx.appendChild(p);
      var b=el("button","tic","✓"); b.type="button"; b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label","Marcar como hecho: "+it.titulo);
      b.addEventListener("click",function(){toggle(it)});
      li.appendChild(tx); li.appendChild(b); ul.appendChild(li);
    });
    ok.forEach(function(it){
      var li=el("li","t hecho");
      var tx=el("div","txt"); tx.appendChild(el("div","tit",it.titulo));
      if(it.estado==="no") tx.appendChild(el("div","nota","Hoy no me toca"));
      var b=el("button","tic","✓"); b.type="button"; b.setAttribute("aria-pressed","true"); b.setAttribute("aria-label","Desmarcar: "+it.titulo);
      b.addEventListener("click",function(){toggle(it)});
      li.appendChild(tx); li.appendChild(b); ul.appendChild(li);
    });
    $("vacio").hidden= total>0 || cargando;

    renderDias(); renderAvisoCal();
  }

  function renderDias(){
    var porDia={}, orden=[];
    (E||[]).forEach(function(ev){var d=evDay(ev); if(!d||d.start<=today) return;
      if(!porDia[d.start]){porDia[d.start]=[];orden.push(d.start)} porDia[d.start].push(String(ev.summary||"(sin título)"));});
    orden.sort(); orden=orden.slice(0,8);
    var tira=$("tira"); tira.textContent="";
    var fd=new Intl.DateTimeFormat("es-ES",{weekday:"short"});
    orden.forEach(function(k){
      var b=el("button","dia"); b.type="button"; b.setAttribute("aria-pressed",diaSel===k?"true":"false");
      var n=porDia[k].length;
      b.appendChild(el("small",null,fd.format(keyDate(k)).replace(/\./g,"")));
      b.appendChild(el("b",null,String(keyDate(k).getDate())));
      b.appendChild(el("small",null,n===1?"1 cosa":n+" cosas"));
      b.addEventListener("click",function(){diaSel=diaSel===k?null:k;renderDias()});
      tira.appendChild(b);
    });
    $("secSig").hidden=orden.length===0;
    var det=$("detalle"); det.textContent="";
    if(diaSel&&porDia[diaSel]){porDia[diaSel].forEach(function(t){det.appendChild(el("li",null,t))}); det.hidden=false;} else det.hidden=true;
  }

  function buscar(id){for(var i=0;i<S.manual.length;i++) if(S.manual[i].id===id) return S.manual[i]; return null}
  function toggle(it){
    if(it.tipo==="cal"){ if(S.cal[it.key]) delete S.cal[it.key]; else S.cal[it.key]="ok"; }
    else{var m=buscar(it.key); if(m) m.done = m.done===today? null : today;}
    save(); render();
  }

  function podar(){
    var lim=addDays(today,-7);
    Object.keys(S.cal).forEach(function(k){var d=k.slice(k.lastIndexOf("@")+1); if(d<lim) delete S.cal[k]});
    S.manual=S.manual.filter(function(m){return !(m.done && m.done<lim)});
  }
  function avisoG(t){var a=$("avisoGuardado"); a.hidden=!t; a.textContent=t||""}
  function save(){
    podar();
    try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
    if(API){apiSave();return}
    if(!ref) return;
    if(writing){dirty=true;return}
    writing=true;
    (function loop(){
      dirty=false;
      ref.set(clone(S)).then(function(){ if(dirty) loop(); else{writing=false; avisoG("");} },
        function(err){writing=false;
          avisoG((err&&err.code==="quota_exceeded")?"No queda espacio para guardar. Quita tareas antiguas.":"No se ha podido guardar este cambio en la nube. Sigue apuntado en este dispositivo.");});
    })();
  }

  $("form").addEventListener("submit",function(ev){
    ev.preventDefault(); var i=$("nueva"), t=i.value.trim(); if(!t) return;
    S.manual.push({id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:t,added:today,done:null});
    i.value=""; save(); render();
  });

  // --- calendario
  var CAL="Google Calendar", TOOL="list_events";
  function calInput(){return {startTime:today+"T00:00:00",endTime:addDays(today,14)+"T00:00:00",orderBy:"startTime",pageSize:80}}
  function leerPayload(res){
    var p=res&&res.payload; if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
    var evs=p&&Array.isArray(p.events)?p.events:[];
    return evs.filter(function(e){return e&&e.status!=="cancelled"});
  }
  function watchCal(){
    if(!mcp) return; if(unsubCal){unsubCal();unsubCal=null}
    unsubCal=mcp.watchTool(CAL,TOOL,calInput(),function(ev){
      if(ev.type==="data"){E=leerPayload(ev.result);calError=null;}
      else{var code=ev.error&&ev.error.code||"upstream_error"; calError=code;
        if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","consent_required"].indexOf(code)>=0){E=[];}
        else if(E===null) E=[];}
      render();
    },{cache:{staleTime:300000,gcTime:86400000},refetchInterval:600000});
  }
  function renderAvisoCal(){
    var box=$("avisoCal"); box.textContent="";
    var msg="", btn=false;
    if(SOLO && !API){renderConecta(box);return}
    if(SOLO){ if(calError) msg="No llego a tu calendario ahora mismo. Se vuelve a intentar al abrir la app."; }
    else if(mcp===false) msg="Aquí no puedo leer tu calendario. Lo que añadas a mano funciona igual.";
    else if(calError==="needs_reauth") msg="Google Calendar ha caducado. Vuelve a conectarlo en Claude, en Ajustes → Conectores.";
    else if(calError==="server_not_connected"||calError==="selection_required") msg="No encuentro Google Calendar. Añádelo en Claude, en Ajustes → Conectores.";
    else if(calError==="approval_required"||calError==="consent_required"){msg="Falta tu permiso para leer el calendario.";btn=true;}
    else if(calError==="not_in_manifest"||calError==="blocked_by_policy") msg="Esta página no tiene permiso para leer el calendario. Lo que añadas a mano funciona igual.";
    else if(calError) msg="El calendario no responde ahora mismo. Se vuelve a intentar solo.";
    box.hidden=!msg; if(!msg) return;
    var p=el("div","aviso"); p.appendChild(el("div",null,msg));
    if(btn){var b=el("button",null,"Permitir leer el calendario"); b.type="button";
      b.addEventListener("click",function(){b.disabled=true;
        mcp.callTool(CAL,TOOL,calInput()).then(function(r){E=leerPayload(r);calError=null;render()},function(){b.disabled=false})});
      p.appendChild(b);}
    box.appendChild(p);
  }

  function tick(){
    $("fecha").textContent=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"short"}).format(new Date()).replace(/\./g,"");
    var k=dayKey(new Date()); if(k!==today){today=k; diaSel=null; watchCal(); apiLoad(); render();}
  }
  setInterval(tick,60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();apiLoad()}});
  setInterval(function(){if(!document.hidden) apiLoad()},300000);

  // --- versión instalada en el móvil: calendario y tics a través de tu script de Google
  var SOLO=!(window.claude&&window.claude.use);
  var API=null, apiPend=false, apiTimer=null, apiBusy=false;
  var RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
  var BASE="https://script.google.com/macros/s/";
  try{API=localStorage.getItem("gato-api")||null; apiPend=localStorage.getItem("gato-pend")==="1";}catch(e){}
  try{var kq=new URLSearchParams(location.search).get("k"); if(kq&&/^[\w-]{20,}$/.test(kq)){API=BASE+kq+"/exec"; try{localStorage.setItem("gato-api",API)}catch(e){}}}catch(e){}
  function ponerK(u){try{var id=u?u.slice(BASE.length,-5):""; history.replaceState(null,"",location.pathname+(id?"?k="+id:""))}catch(e){}}
  if(!SOLO) API=null;
  function setPend(v){apiPend=v; try{localStorage.setItem("gato-pend",v?"1":"0")}catch(e){}}
  function leerApi(url){return fetch(url+"?from="+today+"&days=14").then(function(r){return r.json()}).then(function(j){if(!j||!j.ok) throw new Error("x"); return j})}
  function aplicarApi(j){
    E=Array.isArray(j.events)?j.events:[]; calError=null;
    try{localStorage.setItem("gato-ev",JSON.stringify({d:today,e:E}))}catch(e){}
    if(!apiPend && j.state && Array.isArray(j.state.manual)){S={manual:j.state.manual,cal:j.state.cal||{}}; try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
    render();
  }
  function apiLoad(){ if(!API) return; leerApi(API).then(aplicarApi,function(){calError="red"; if(E===null)E=[]; render()}) }
  function apiSave(){
    setPend(true); clearTimeout(apiTimer);
    apiTimer=setTimeout(function enviar(){
      if(apiBusy){apiTimer=setTimeout(enviar,400);return}
      apiBusy=true; var foto=JSON.stringify({state:S});
      fetch(API,{method:"POST",body:foto}).then(function(r){return r.json()}).then(function(){
        apiBusy=false; if(JSON.stringify({state:S})===foto){setPend(false);avisoG("")}
      },function(){apiBusy=false; avisoG("Sin conexión: el cambio se queda en este móvil y se envía la próxima vez.")});
    },500);
  }
  function renderConecta(box){
    box.hidden=false;
    var p=el("div","aviso conecta"); p.appendChild(el("div",null,"Conecta tu calendario: pega aquí el enlace de tu script de Google."));
    var i=el("input"); i.type="url"; i.id="enlace"; i.placeholder="https://script.google.com/macros/s/…/exec"; i.setAttribute("aria-label","Enlace del script");
    var m=el("div"); m.style.marginTop="6px";
    var b=el("button",null,"Conectar"); b.type="button";
    b.addEventListener("click",function(){
      var u=i.value.trim();
      if(!RE.test(u)){m.textContent="Ese enlace no parece el del script. Tiene que empezar por https://script.google.com/macros/s/ y acabar en /exec.";return}
      b.disabled=true; m.textContent="Probando…";
      leerApi(u).then(function(j){API=u; try{localStorage.setItem("gato-api",u)}catch(e){} $("pie").hidden=false; ponerK(u); aplicarApi(j); if(S.manual.length||Object.keys(S.cal).length) apiSave();},
        function(){b.disabled=false; m.textContent="El enlace no responde. Revisa que en la implementación el acceso sea «Cualquier usuario».";});
    });
    p.appendChild(i); p.appendChild(b); p.appendChild(m); box.appendChild(p);
  }
  $("desconectar").addEventListener("click",function(){API=null; try{localStorage.removeItem("gato-api");localStorage.removeItem("gato-ev")}catch(e){} ponerK(null); E=[]; calError=null; $("pie").hidden=true; render();});

  // --- ronroneo al tocar al gato
  var actx=null;
  $("escena").addEventListener("click",function(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
      var t=actx.currentTime, d=2.8, n=Math.floor(actx.sampleRate*d), buf=actx.createBuffer(1,n,actx.sampleRate), ch=buf.getChannelData(0), last=0;
      for(var k=0;k<n;k++){var w=Math.random()*2-1; last=(last+0.02*w)/1.02; ch[k]=last*3.5;}
      var src=actx.createBufferSource(); src.buffer=buf;
      var lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=240;
      var trem=actx.createGain(); trem.gain.value=.55;
      var lfo=actx.createOscillator(); lfo.type="sawtooth"; lfo.frequency.value=24; var lg=actx.createGain(); lg.gain.value=.45;
      var env=actx.createGain(); env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(.9,t+.4); env.gain.linearRampToValueAtTime(0,t+d);
      lfo.connect(lg); lg.connect(trem.gain); src.connect(lp); lp.connect(trem); trem.connect(env); env.connect(actx.destination);
      src.start(t); lfo.start(t); lfo.stop(t+d);
    }catch(e){}
  });

  tick();
  if(SOLO){
    mcp=false;
    if(API){
      $("pie").hidden=false; ponerK(API);
      try{var c=JSON.parse(localStorage.getItem("gato-ev")||"null"); if(c&&c.d===today&&Array.isArray(c.e)) E=c.e;}catch(e){}
      render(); if(apiPend) apiSave(); apiLoad();
    } else { E=[]; render(); }
    return;
  }
  render();
  var use=window.claude.use.bind(window.claude);

  use("mcp").then(function(m){ if(m){mcp=m;watchCal();} else{mcp=false;E=[];render();} },function(){mcp=false;E=[];render()});

  use("db").then(function(db){
    if(!db){ avisoG("Los tics se guardan solo en este dispositivo."); return; }
    ref=db.doc("sofa/estado");
    var t=setTimeout(function(){ avisoG("Aún no llego a los datos guardados. Lo que ves puede no estar al día."); },10000);
    ref.onSnapshot(function(snap){
      if(!snap.metadata.fromCache){clearTimeout(t); if(!writing) avisoG("");}
      if(snap.metadata.hasPendingWrites||writing) return;
      if(snap.exists){var d=snap.data()||{};
        S={manual:Array.isArray(d.manual)?clone(d.manual):[], cal:(d.cal&&typeof d.cal==="object")?clone(d.cal):{}};
        try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        render();}
    },function(){clearTimeout(t); ref=null; avisoG("No puedo guardar en la nube ahora. Los tics se quedan en este dispositivo.");});
  },function(){});
})();
</script>
</body>
</html>
